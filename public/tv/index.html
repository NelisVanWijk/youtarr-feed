<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyTube TV</title>
  <link rel="icon" href="/icon-512.png">
  <link rel="stylesheet" href="/tv/tv.css">
</head>
<body>
<main id="library">
  <header><div class="brand"><span class="mark">&#9654;</span> MyTube <small>TV</small></div><span id="clock"></span></header>
  <nav aria-label="Library">
    <button data-tab="all" aria-pressed="true"><svg aria-hidden="true"><use href="/tv/icons.svg#feed"/></svg> Feed</button>
    <button data-tab="downloads"><svg aria-hidden="true"><use href="/tv/icons.svg#download"/></svg> Downloads</button>
    <button data-tab="continue"><svg aria-hidden="true"><use href="/tv/icons.svg#history"/></svg> Continue watching</button>
    <button data-tab="unwatched"><svg aria-hidden="true"><use href="/tv/icons.svg#unwatched"/></svg> Unwatched</button>
    <button id="refresh"><svg aria-hidden="true"><use href="/tv/icons.svg#restart"/></svg> Refresh</button>
    <button id="exit"><svg aria-hidden="true"><use href="/tv/icons.svg#back"/></svg> Exit</button>
  </nav>
  <div class="heading"><div><h1 id="heading">Your feed</h1></div><label>Channel <select id="channel"><option value="">All channels</option></select></label></div>
  <p id="status" role="status">Loading your library&hellip;</p>
  <div id="grid" class="grid"></div>
  <footer>&uarr; &darr; &larr; &rarr; Browse &nbsp; &middot; &nbsp; OK Select &nbsp; &middot; &nbsp; Back Return</footer>
</main>
<section id="player" hidden aria-label="Video player">
  <video id="video" playsinline preload="metadata"></video>
  <div id="controls">
    <p class="eyebrow" id="playing-channel"></p><h1 id="playing-title"></h1>
    <p id="quality">Original quality</p><p id="player-status" role="status"></p>
    <div class="timeline"><div id="position"></div></div><p id="time">0:00 / 0:00</p>
    <div class="actions">
      <button id="back" aria-label="Back to library" title="Back to library"><svg aria-hidden="true"><use href="/tv/icons.svg#back"/></svg></button>
      <button id="rewind" aria-label="Rewind 10 seconds" title="Rewind 10 seconds">&minus;10</button>
      <button id="toggle" aria-label="Play" title="Play"><svg aria-hidden="true"><use id="toggle-glyph" href="/tv/icons.svg#play"/></svg></button>
      <button id="forward" aria-label="Forward 10 seconds" title="Forward 10 seconds">+10</button>
      <button id="restart" aria-label="Start over" title="Start over"><svg aria-hidden="true"><use href="/tv/icons.svg#restart"/></svg></button>
      <label id="source-label" hidden>Version <select id="source"><option value="primary">Primary</option></select></label>
    </div>
    <p class="hint">OK Show controls / Play &middot; Left / Right Seek &middot; Back Library</p>
  </div>
</section>
<dialog id="exit-dialog"><h2>Finished watching?</h2><button id="stay">Keep browsing</button><button id="confirm-exit">Exit MyTube</button></dialog>
<dialog id="download-dialog" aria-labelledby="download-title">
  <p class="eyebrow" id="download-channel"></p><h2 id="download-title"></h2><p id="download-message" role="status"></p>
  <p class="hint">Downloads use your Youtarr quality settings. Choose 2160p there for 4K when available.</p>
  <button id="download-start">Download</button><button id="download-check">Check status</button><button id="download-close">Back to browsing</button>
</dialog>
<script src="/tv/tv.js"></script>
</body>
</html>
