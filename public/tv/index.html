<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyTube TV</title>
  <link rel="icon" href="/icon-512.png">
  <link rel="stylesheet" href="/tv/tv.css?v=20260912c">
</head>
<body>
<main id="library">
  <header><span id="clock"></span></header>
  <nav id="navigation" aria-label="Hoofdmenu">
    <button data-tab="search"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#search"/></svg> Zoeken</button>
    <button data-tab="all" aria-pressed="true"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#home"/></svg> Home</button>
    <button data-tab="subscriptions"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#feed"/></svg> Abonnementen</button>
    <button data-tab="downloads"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#download"/></svg> Bibliotheek</button>
    <button data-tab="floatplane"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#play"/></svg> Floatplane</button>
    <button id="refresh"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#restart"/></svg> Refresh</button>
    <button id="server-settings"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#settings"/></svg> Serveradres</button>
    <button id="exit"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#back"/></svg> Exit</button>
  </nav>
  <aside id="channels" aria-label="Kanalen" hidden></aside>
  <div class="heading"><h1 id="heading">Home</h1></div>
  <input id="search" type="search" aria-label="Zoeken in je feed" placeholder="Zoeken in je feed" hidden>
  <div id="library-filters" hidden><button data-filter="downloads" aria-pressed="true">Alles</button> <button data-filter="continue">Verder kijken</button> <button data-filter="unwatched">Onbekeken</button></div>
  <p id="status" role="status">Loading your library&hellip;</p>
  <div id="results"><div id="grid" class="grid"></div>
  <button id="load-more" hidden>Meer video's laden</button></div>
</main>
<section id="player" hidden aria-label="Video player">
  <video id="video" playsinline preload="metadata"></video>
  <div id="controls">
    <p class="eyebrow" id="playing-channel"></p><h1 id="playing-title"></h1>
    <p id="quality">Original quality</p><p id="player-status" role="status"></p>
    <div class="timeline"><div id="position"></div></div><p id="time">0:00 / 0:00</p>
    <div class="actions">
      <button id="back" aria-label="Back to library" title="Back to library"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#back"/></svg></button>
      <button id="rewind" aria-label="Rewind 10 seconds" title="Rewind 10 seconds">&minus;10</button>
      <button id="toggle" aria-label="Play" title="Play"><svg aria-hidden="true"><use id="toggle-glyph" href="/tv/icons.svg?v=20260912c#play"/></svg></button>
      <button id="forward" aria-label="Forward 10 seconds" title="Forward 10 seconds">+10</button>
      <button id="restart" aria-label="Start over" title="Start over"><svg aria-hidden="true"><use href="/tv/icons.svg?v=20260912c#restart"/></svg></button>
      <label id="source-label" hidden>Version <select id="source"><option value="primary">Primary</option></select></label>
    </div>
    <p class="hint">OK Show controls / Play &middot; Left / Right Seek &middot; Back Library</p>
  </div>
</section>
<dialog id="exit-dialog"><h2>Finished watching?</h2><button id="stay">Keep browsing</button><button id="confirm-exit">Exit MyTube</button></dialog>
<dialog id="server-dialog" aria-labelledby="server-heading">
  <h2 id="server-heading">MyTube-server</h2>
  <form id="server-form"><label for="server-address">Serveradres inclusief poort</label><input id="server-address" type="url" required placeholder="http://192.168.1.100:3090">
  <p id="server-error" role="alert"></p><button type="submit">Verbinden</button><button id="server-cancel" type="button">Annuleren</button></form>
</dialog>
<dialog id="download-dialog" aria-labelledby="download-title">
  <p class="eyebrow" id="download-channel"></p><h2 id="download-title"></h2><p id="download-message" role="status"></p>
  <p class="hint">Downloads use your Youtarr quality settings. Choose 2160p there for 4K when available.</p>
  <button id="download-start">Download</button><button id="download-check">Check status</button><button id="download-close">Back to browsing</button>
</dialog>
<script src="/tv/tv.js?v=20260912c"></script>
</body>
</html>
