<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTube</title>
<style>body{background:#101114;color:#fff;font:28px Arial;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}main{width:900px}h1{font-size:64px}p{color:#babcc5;line-height:1.5}label{display:block;margin:30px 0 12px}input,button{font:inherit;padding:22px;border-radius:12px;border:2px solid #555;background:#25262b;color:#fff}input{width:94%}button{margin:28px 16px 0 0}button:focus,input:focus{outline:5px solid white;outline-offset:5px}#open{background:#d92338}#error{color:#ffb7ae;min-height:42px}</style></head>
<body><main><h1>▶ MyTube</h1><p>Your library, on the big screen.</p><form id="setup"><label for="server">MyTube server address</label><input id="server" type="url" placeholder="http://192.168.1.100:3090" required autocomplete="url"><p>Use the address of your MyTube app, including its port.</p><button id="open" type="submit">Open MyTube</button><button id="exit" type="button">Exit</button></form><p id="error" role="alert"></p></main><script src="launcher.js"></script></body></html>
