<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTube</title>
<style>body{background:#080808;color:#fff;font:32px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}main{width:1000px;max-width:85vw}h1{font-size:64px;margin-bottom:20px}p{color:#bbb;line-height:1.5}label{display:block;margin:30px 0 12px}input,button{box-sizing:border-box;font:inherit;padding:22px;border-radius:16px;border:2px solid #555;background:#191919;color:#fff}input{width:100%}button{margin:28px 16px 0 0}button:focus,input:focus{outline:5px solid white;outline-offset:5px}#open{background:#eee;color:#111}#error{color:#ffb7ae;min-height:42px}</style></head>
<body><main><h1>MyTube op je tv</h1><p>Kies je server. Je kunt dit adres bij elke nieuwe start aanpassen.</p><form id="setup"><label for="server">MyTube-serveradres</label><input id="server" type="url" placeholder="http://192.168.1.100:3090" required autocomplete="url"><p>Gebruik het adres van je MyTube-app, inclusief de poort. Het adres wordt op deze tv onthouden.</p><button id="open" type="submit">Open MyTube</button><button id="exit" type="button">Afsluiten</button></form><p id="error" role="alert"></p></main><script src="launcher.js"></script></body></html>
