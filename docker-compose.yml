services:
  youtarr-feed:
    image: ghcr.io/nelisvanwijk/youtarr-feed:latest
    container_name: youtarr-feed
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3090:3000"
    volumes:
      - ./data:/data
      # Gebruik hier dezelfde hostmap als Youtarr, read-only.
      # Pas de hostpath aan voor jouw server.
      - /mnt/user/Media/Youtarr:/usr/src/app/data:ro
