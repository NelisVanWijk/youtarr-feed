services:
  youtarr-feed:
    image: ghcr.io/nelisvanwijk/youtarr-feed:latest
    container_name: youtarr-feed
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3090:3000"
    devices:
      # Optional: Intel Quick Sync / VAAPI for Apple-compatible HLS transcoding.
      - /dev/dri:/dev/dri
    volumes:
      - ./data:/data
      # Use the same host folder as Youtarr, read-only.
      # Adjust the host path for your server.
      - /mnt/user/Media/Youtarr:/usr/src/app/data:ro
